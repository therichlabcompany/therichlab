<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Profile Editor Step2 (Crop)</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #f5f6f8;
    margin: 0;
    padding: 30px;
}

.wrapper {
    display: flex;
    gap: 30px;
}

/* 편집 영역 */
.editor {
    position: relative;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
}

/* 원형 마스크 */
.mask {
    position: relative;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #ddd;
}

/* 캔버스 */
canvas {
    width: 400px;
    height: 400px;
}

/* 미리보기 */
.preview {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card {
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- LEFT -->
    <div class="editor">
        <h3>프로필 편집</h3>
        <input type="file" id="imgInput">

        <button id="save">PNG 저장</button>

        <div class="mask">
            <canvas id="main" width="400" height="400"></canvas>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="preview">
        <div class="card">
            <h4>50px</h4>
            <canvas id="p50" width="50" height="50"></canvas>
        </div>

        <div class="card">
            <h4>100px</h4>
            <canvas id="p100" width="100" height="100"></canvas>
        </div>
    </div>

</div>

<script>

var main = new fabric.Canvas('main');
var p50 = new fabric.Canvas('p50');
var p100 = new fabric.Canvas('p100');


/* =========================
   이미지 로드
========================= */
function loadImage(url){

    fabric.Image.fromURL(url, function(img){

        main.clear();

        var cw = main.getWidth();
        var ch = main.getHeight();

        var scale = Math.min(cw / img.width, ch / img.height);

        img.set({
            left: cw/2,
            top: ch/2,
            originX: 'center',
            originY: 'center',
            scaleX: scale,
            scaleY: scale,
            selectable: true
        });

        main.add(img);
        renderPreview();
    });
}


/* =========================
   🔥 원 안에서만 드래그 제한
========================= */
main.on('object:moving', function(e){

    var obj = e.target;

    var radius = main.getWidth() / 2;

    var dx = obj.left - radius;
    var dy = obj.top - radius;

    var dist = Math.sqrt(dx*dx + dy*dy);

    if(dist > radius){

        var angle = Math.atan2(dy, dx);

        obj.left = radius + radius * Math.cos(angle);
        obj.top = radius + radius * Math.sin(angle);
    }
});


/* =========================
   미리보기 렌더
========================= */
function renderPreview(){

    [p50, p100].forEach(function(canvas){

        canvas.clear();

        var scale = canvas.getWidth() / main.getWidth();

        main.getObjects().forEach(function(obj){

            obj.clone(function(clone){

                clone.set({
                    left: obj.left * scale,
                    top: obj.top * scale,
                    scaleX: obj.scaleX * scale,
                    scaleY: obj.scaleY * scale,
                    selectable: false
                });

                canvas.add(clone);
                canvas.renderAll();
            });
        });
    });
}


/* =========================
   업로드
========================= */
$('#imgInput').on('change', function(e){

    var reader = new FileReader();

    reader.onload = function(f){
        loadImage(f.target.result);
    };

    reader.readAsDataURL(e.target.files[0]);
});


main.on('object:modified', renderPreview);
main.on('object:added', renderPreview);


/* =========================
   🔥 원형 PNG 저장 (핵심)
========================= */
$('#save').on('click', function(){

    var exportCanvas = document.createElement('canvas');
    var ctx = exportCanvas.getContext('2d');

    var size = 400;

    exportCanvas.width = size;
    exportCanvas.height = size;

    // 원형 클리핑
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();

    // Fabric export
    ctx.drawImage(main.lowerCanvasEl, 0, 0, size, size);

    var link = document.createElement('a');
    link.href = exportCanvas.toDataURL('image/png');
    link.download = "profile.png";
    link.click();
});

</script>

</body>
</html>
